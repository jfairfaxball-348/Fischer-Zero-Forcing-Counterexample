name: Stage 1 Kernel Build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage1-kernel-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Independent reconstruction check
        run: python3 verification/check_fischer_h.py
      - name: Kernel-only full Lake build
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: true
